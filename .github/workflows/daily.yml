name: Daily Pontora Outreach

on:
  schedule:
    # 7:30 AM Pacific = 14:30 UTC (during PDT, daylight time)
    # Note: GitHub runs on UTC. During PST (winter), this will be 6:30 AM your time.
    # Adjust the cron in November/March if that matters.
    - cron: '30 14 * * 1-5'   # Mon-Fri at 14:30 UTC
  workflow_dispatch:           # also allow manual trigger from GitHub UI

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account JSON from secret
        run: |
          mkdir -p config
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | tr -d ' \n\r' | base64 -d > config/google-service-account.json

      - name: Write Gmail OAuth JSON files from secrets
        run: |
          echo "${{ secrets.GMAIL_OAUTH_CLIENT_JSON_B64 }}" | tr -d ' \n\r' | base64 -d > config/gmail-oauth-client.json
          echo "${{ secrets.GMAIL_TOKEN_JSON_B64 }}" | tr -d ' \n\r' | base64 -d > config/gmail-token.json

      - name: Suggest website mock opportunities
        continue-on-error: true
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: config/google-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TIMEZONE: America/Los_Angeles
        run: |
          python scripts/suggest_website_mocks.py --write-sheet --include-ready-to-send --limit 40

      - name: Render website mocks
        id: render_mocks
        if: ${{ vars.WEBSITE_MOCK_BASE_URL != '' && vars.CLOUDFLARE_MOCKS_WORKER_NAME != '' }}
        continue-on-error: true
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: config/google-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          WEBSITE_MOCK_BASE_URL: ${{ vars.WEBSITE_MOCK_BASE_URL }}
          CLICK_LOGGER_URL: ${{ vars.CLICK_LOGGER_URL }}
          TIMEZONE: America/Los_Angeles
        run: |
          python scripts/generate_website_mocks.py --base-url "$WEBSITE_MOCK_BASE_URL" --output-dir generated/website-mocks-site --force

      - name: Deploy website mocks to Cloudflare Workers
        id: deploy_mocks
        if: ${{ vars.WEBSITE_MOCK_BASE_URL != '' && vars.CLOUDFLARE_MOCKS_WORKER_NAME != '' && steps.render_mocks.outcome == 'success' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets generated/website-mocks-site --name=${{ vars.CLOUDFLARE_MOCKS_WORKER_NAME }} --compatibility-date=2026-08-04

      - name: Update website mock metadata in Sheet
        if: ${{ vars.WEBSITE_MOCK_BASE_URL != '' && vars.CLOUDFLARE_MOCKS_WORKER_NAME != '' && steps.deploy_mocks.outcome == 'success' }}
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: config/google-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          WEBSITE_MOCK_BASE_URL: ${{ vars.WEBSITE_MOCK_BASE_URL }}
          CLICK_LOGGER_URL: ${{ vars.CLICK_LOGGER_URL }}
          TIMEZONE: America/Los_Angeles
        run: |
          python scripts/generate_website_mocks.py --base-url "$WEBSITE_MOCK_BASE_URL" --output-dir generated/website-mocks-site --write-sheet

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS_PATH: config/google-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          BRAND_NAME: Pontora
          PRODUCT_DOMAIN: mypontora.com
          PRODUCT_URL: https://mypontora.com
          DEMO_URL: https://mypontora.com/demo
          OUTREACH_EMAIL: ketan@mypontora.com
          OUTREACH_ADMIN_URL: https://enrollify-admin.onrender.com
          WEBSITE_MOCK_BASE_URL: ${{ vars.WEBSITE_MOCK_BASE_URL }}
          CLICK_LOGGER_URL: ${{ vars.CLICK_LOGGER_URL }}
          GMAIL_OAUTH_CLIENT_PATH: config/gmail-oauth-client.json
          GMAIL_TOKEN_PATH: config/gmail-token.json
          DEFAULT_DAILY_EMAIL_CAP: 20
          WORKING_HOURS_START: 9
          WORKING_HOURS_END: 17
          TIMEZONE: America/Los_Angeles
          HOME_ZIP: 90045
        run: |
          python scripts/run_daily.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f config/google-service-account.json
          rm -f config/gmail-oauth-client.json
          rm -f config/gmail-token.json
