# Render deployment config.
# Commit this to repo root, then create the service on render.com pointing at this file.

services:
  - type: web
    name: pontora-outreach-admin
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.webapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: BRAND_NAME
        value: Pontora
      - key: PRODUCT_DOMAIN
        value: mypontora.com
      - key: PRODUCT_URL
        value: https://mypontora.com
      - key: DEMO_URL
        value: https://mypontora.com/demo
      - key: OUTREACH_EMAIL
        value: ketan@mypontora.com
      - key: OUTREACH_ADMIN_URL
        value: https://enrollify-admin.onrender.com
      - key: GMAIL_OAUTH_CLIENT_PATH
        value: /etc/secrets/gmail-oauth-client.json
      - key: GMAIL_TOKEN_PATH
        value: /etc/secrets/gmail-token.json
      - key: HOME_ZIP
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_PATH
        value: /etc/secrets/google-service-account.json
      - key: SITE_GENERATOR_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: pontora-generated-sites
      - key: GENERATED_SITES_BASE_URL
        value: https://sites.mypontora.com
